<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sangatta Pit Alpha - July 2026 • Rainbow Contour Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .neo-box { border: 4px solid #0f172a; box-shadow: 6px 6px 0px #0f172a; }
    </style>
</head>
<body class="bg-amber-50 p-6 font-sans text-slate-900">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="neo-box bg-yellow-300 border-4 border-slate-900 p-4 flex justify-between items-center">
            <h1 class="text-2xl font-black uppercase">RAINBOW CONTOUR ENGINE — Sangatta Pit Alpha - July 2026</h1>
            <div class="space-x-3">
                <button onclick="exportPDF()" class="neo-box bg-white px-4 py-2 font-bold hover:bg-slate-100">Export PDF Kop</button>
            </div>
        </header>
        <main class="grid grid-cols-4 gap-6">
            <div class="col-span-1 neo-box bg-white p-4 space-y-4">
                <h2 class="font-black text-lg border-b-2 border-slate-900 pb-2">Volume Summary</h2>
                <p>Cut: <span class="font-bold text-red-600">0 m³</span></p>
                <p>Fill: <span class="font-bold text-blue-600">80000 m³</span></p>
                <p>Net: <span class="font-bold">80000 m³</span></p>
            </div>
            <div class="col-span-3 neo-box bg-slate-900 h-[500px] relative">
                <canvas id="contourCanvas" class="w-full h-full"></canvas>
            </div>
        </main>
    </div>
</body>
</html>
