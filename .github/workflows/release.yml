name: Multi-OS Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os-name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            os-name: Windows x86_64
            target: x86_64-pc-windows-msvc
            binary_name: rainbow-contour.exe
            archive_name: rainbow-contour-windows-x86_64.zip

          # Linux x86_64
          - os: ubuntu-latest
            os-name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: rainbow-contour
            archive_name: rainbow-contour-linux-x86_64.tar.gz

          # macOS Apple Silicon (ARM64 M1/M2/M3)
          - os: macos-latest
            os-name: macOS Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            binary_name: rainbow-contour
            archive_name: rainbow-contour-macos-arm64.tar.gz

          # macOS Intel (x86_64)
          - os: macos-13
            os-name: macOS Intel (x86_64)
            target: x86_64-apple-darwin
            binary_name: rainbow-contour
            archive_name: rainbow-contour-macos-x86_64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          Copy-Item rainbow-contour.bat dist/
          Copy-Item config.dat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Package for Unix (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cp rainbow-contour.sh dist/
          cp config.dat dist/
          cp README.md dist/
          tar -czvf ${{ matrix.archive_name }} -C dist .

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
